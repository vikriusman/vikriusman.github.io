- kind: Lab
  code: "01"
  title: Stateless Monolith on Kubernetes
  summary: >-
    A stateful PHP monolith scaled horizontally without a rewrite: sessions moved to
    Redis, uploads to S3-compatible storage mounted through the Mountpoint CSI driver.
  stack: [Kubernetes, CodeIgniter 3, Redis, Mountpoint S3 CSI, RustFS, Terraform, EC2]
  proof: Sessions and files stayed consistent across pods on two separate EC2 machines.
  link: https://github.com/vikriusman/curated/tree/main/01-stateless-monolith

- kind: Lab
  code: "02"
  title: Canary Releases Gated by Readiness and Log Analysis
  summary: >-
    A 12-factor Go service released by weight at Envoy Gateway, with Argo Rollouts
    asking Loki for the canary's error rate before every step.
  stack: [Go, Envoy Gateway, Argo Rollouts, Loki, Alloy, Postgres, k3s]
  proof: A release that passed every probe was stopped by its own logs at 5% of traffic.
  link: https://github.com/vikriusman/curated/tree/main/02-progressive-delivery

- kind: Field note
